name: Daily Citation Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch GS citations
        run: python scripts/gs_sync.py
      - name: Commit if changed
        run: |
          git config user.name "gs-sync-bot"
          git config user.email "gs-sync-bot@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "Auto-sync citations from Google Scholar"
          git push
